<!DOCTYPE html>

 <!-- Fig. 3.17: autocomplete.html -->
 <!-- New HTML5 form autocomplete attribute and datalist element. -->
 <html lang="en">
 <head>
 		<meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Autocomplete and Datalist Demo</title>
 </head>

 	<body>
 		<h1>Autocomplete and Datalist Demo</h1>
 <p>This form demonstrates the new HTML5 autocomplete attribute
 			and the datalist element.
 		</p>

 <!-- turn autocomplete on -->

 <form method="get" autocomplete="on">

 <p>
<label>First Name:
    <input type="text" id="firstName" name="firstName"
 placeholder = "First name" /> (First name)
 	</label>
</p>
 
<p>
<label>Last Name:
    <input type="text" id="lastName" name="lastName"
 	placeholder = "Last name" /> (Last name)
 	</label>
</p>
 <p>
<label>Email:
    <input type="email" id="email" name="email"
 	placeholder = "name@domain.com" /> (name@domain.com)
 	</label>
</p>
 
<p>
<label for = "txtList">Birth Month:
<input type="text" id="txtList" name="birthMonth"
placeholder = "Select a month" list = "months" />

<datalist id = "months">
<option value = "January">
<option value = "February">
<option value = "March">
<option value = "April">
<option value = "May">
<option value = "June">
<option value = "July">
<option value = "August">
<option value = "September">
<option value = "October">
<option value = "November">
<option value = "December">
</datalist>
</label>
</p>

<p>
<input type = "submit" value = "Submit" />
 		<input type = "reset" value = "Clear" />
</p>
 
</form>
 </body>
 </html>
