<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Add a destination | Tour Planner</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="data-page">
        <main class="data-card">
            <h1>Add a destination</h1>
            <p class="form-notice">This static demo does not save destination data. A server is required to persist changes.</p>
            <form id="destination-form">
                <p>
                    <label for="place-id">Destination ID</label><br>
                    <input id="place-id" name="placeId" type="text" required>
                </p>
                <p>
                    <label for="place-name">Destination name</label><br>
                    <input id="place-name" name="placeName" type="text" required>
                </p>
                <p>
                    <label for="location">Country or region</label><br>
                    <input id="location" name="location" type="text" required>
                </p>
                <p>
                    <label for="estimated-cost">Estimated cost (sample)</label><br>
                    <input id="estimated-cost" name="estimatedCost" type="number" min="0" step="0.01" required>
                </p>
                <p>
                    <label for="duration">Suggested duration (hours)</label><br>
                    <input id="duration" name="durationHours" type="number" min="1" step="1" required>
                </p>
                <button class="form-button" type="submit">Check destination</button>
                <p class="form-status" id="destination-status" role="status" aria-live="polite"></p>
            </form>
            <p><a href="table.html">View sample destinations</a> · <a href="index.html">Back to home</a></p>
        </main>
        <script>
            document.getElementById("destination-form").addEventListener("submit", (event) => {
                event.preventDefault();
                document.getElementById("destination-status").textContent =
                    "The destination details are valid, but they cannot be saved until a server is connected.";
            });
        </script>
    </body>
</html>
