<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Register | Tour Planner</title>
        <link rel="icon" href="images/site_logo.jpg" type="image/jpeg">
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    </head>
    <body class="form-page">
        <main>
            <form class="form-card" id="registration-form">
                <h1>Create an account</h1>
                <p>Enter your details to register with Tour Planner.</p>
                <p class="form-notice">This static demo has no account service. Submitting this form will not create or store an account.</p>

                <label for="firstName">First name</label>
                <input type="text" id="firstName" name="firstName" autocomplete="given-name" required>

                <label for="lastName">Last name</label>
                <input type="text" id="lastName" name="lastName" autocomplete="family-name" required>

                <label for="dob">Date of birth <span>(optional)</span></label>
                <input type="date" id="dob" name="dob" autocomplete="bday">

                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" minlength="8" autocomplete="new-password" required>

                <label for="password-confirmation">Confirm password</label>
                <input type="password" id="password-confirmation" name="passwordConfirmation" minlength="8" autocomplete="new-password" required>

                <button type="submit" class="form-button">Check details</button>
                <p class="form-status" id="registration-status" role="status" aria-live="polite"></p>
                <p class="form-footer">Already have an account? <a href="sign_in.html">Sign in</a>.</p>
                <p class="form-footer"><a href="index.html">Back to home</a></p>
            </form>
        </main>
        <script>
            const registrationForm = document.getElementById("registration-form");
            const password = document.getElementById("password");
            const passwordConfirmation = document.getElementById("password-confirmation");
            const registrationStatus = document.getElementById("registration-status");

            function validatePasswordConfirmation() {
                const passwordsMatch = password.value === passwordConfirmation.value;
                passwordConfirmation.setCustomValidity(passwordsMatch ? "" : "Passwords must match.");
            }

            password.addEventListener("input", validatePasswordConfirmation);
            passwordConfirmation.addEventListener("input", validatePasswordConfirmation);
            registrationForm.addEventListener("submit", (event) => {
                event.preventDefault();
                registrationStatus.textContent =
                    "The details are valid, but registration is unavailable until an account service is connected. No account was created.";
            });
        </script>
    </body>
</html>
