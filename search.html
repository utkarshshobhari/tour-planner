<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Search featured destinations with Tour Planner.">
        <title>Search destinations | Tour Planner</title>
        <link rel="icon" href="images/site_logo.jpg" type="image/jpeg">
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,700;1,500&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="search-header">
            
            <nav>
               <a href="index.html" aria-label="Tour Planner home"><img src="images/site_logo.jpg" alt="Tour Planner logo"></a>
               <div class="nav_links">
                   <ul>
                       <li><a href="index.html">Home</a></li>
                       <li><a href="search.html">Search destinations</a></li>
                       <li><a href="index.html#about">About</a></li>
                       <li><a href="index.html#contact">Contact</a></li>
                       <li><a href="registration.html">Register</a></li>
                       <li><a href="sign_in.html">Sign in</a></li>
                   </ul>
               </div>
           </nav>
           
            <div class="search-container">
                <h1>Find your next destination</h1>
                <form id="search-form" role="search">
                  <input id="destination-search" type="search" placeholder="Try Paris, London, or Bangkok" name="search" aria-label="Search destinations">
                  <button type="submit">Search</button>
                </form>
            </div>
        </div>

        <main>
            <div class="slideshow-container" id="destination-slides">
                <div class="mySlides" data-place="london">
                    <div class="numbertext"></div>
                    <img src="images/londonfull.jpg" alt="Big Ben and the Houses of Parliament in London">
                    <div class="slide-caption">London</div>
                </div>
                <div class="mySlides" data-place="paris">
                    <div class="numbertext"></div>
                    <img src="images/parisfull.jpg" alt="Paris cityscape">
                    <div class="slide-caption">Paris</div>
                </div>
                <div class="mySlides" data-place="bangkok">
                    <div class="numbertext"></div>
                    <img src="images/bangkokfull.jpg" alt="Bangkok cityscape">
                    <div class="slide-caption">Bangkok</div>
                </div>
                <button class="prev" type="button" aria-label="Previous destination">&#10094;</button>
                <button class="next" type="button" aria-label="Next destination">&#10095;</button>
            </div>
            <p class="no-results" id="no-results" role="status" hidden>No destinations match your search.</p>
            <div class="slide-dots" id="slide-dots" aria-label="Choose a destination">
                <button class="dot" type="button" data-place="london" aria-label="Show London"></button>
                <button class="dot" type="button" data-place="paris" aria-label="Show Paris"></button>
                <button class="dot" type="button" data-place="bangkok" aria-label="Show Bangkok"></button>
            </div>
        </main>

        <script>
            const slides = Array.from(document.querySelectorAll(".mySlides"));
            const dots = Array.from(document.querySelectorAll(".dot"));
            const slideshow = document.getElementById("destination-slides");
            const dotsContainer = document.getElementById("slide-dots");
            const noResults = document.getElementById("no-results");
            let matchingSlides = slides;
            let slideIndex = 0;

            function showSlide(index) {
                if (matchingSlides.length === 0) return;
                slideIndex = (index + matchingSlides.length) % matchingSlides.length;
                slides.forEach((slide) => { slide.hidden = true; });
                dots.forEach((dot) => { dot.classList.remove("active"); });

                const activeSlide = matchingSlides[slideIndex];
                activeSlide.hidden = false;
                activeSlide.querySelector(".numbertext").textContent =
                    `${slideIndex + 1} / ${matchingSlides.length}`;
                dots.find((dot) => dot.dataset.place === activeSlide.dataset.place)
                    .classList.add("active");
            }

            function filterDestinations(query) {
                const searchTerm = query.trim().toLocaleLowerCase();
                matchingSlides = slides.filter((slide) =>
                    slide.dataset.place.includes(searchTerm)
                );
                dots.forEach((dot) => {
                    dot.hidden = !matchingSlides.some((slide) =>
                        slide.dataset.place === dot.dataset.place
                    );
                });
                slideshow.hidden = matchingSlides.length === 0;
                dotsContainer.hidden = matchingSlides.length < 2;
                noResults.hidden = matchingSlides.length > 0;
                showSlide(0);
            }

            document.getElementById("search-form").addEventListener("submit", (event) => {
                event.preventDefault();
                filterDestinations(document.getElementById("destination-search").value);
            });
            document.querySelector(".prev").addEventListener("click", () => showSlide(slideIndex - 1));
            document.querySelector(".next").addEventListener("click", () => showSlide(slideIndex + 1));
            dots.forEach((dot) => dot.addEventListener("click", () => {
                const index = matchingSlides.findIndex((slide) =>
                    slide.dataset.place === dot.dataset.place
                );
                showSlide(index);
            }));
            filterDestinations("");
        </script>


    </body>
</html>
