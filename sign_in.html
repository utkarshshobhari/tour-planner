<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign in | Tour Planner</title>
        <link rel="icon" href="images/site_logo.jpg" type="image/jpeg">
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    </head>
    <body class="form-page">
        <main>
            <form class="form-card" id="sign-in-form">
                <h1>Sign in</h1>
                <p>Sign in to your Tour Planner account.</p>
                <p class="form-notice">Sign-in is not connected to an authentication service in this static demo. Your credentials will not be sent or stored.</p>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>

                <button type="submit" class="form-button">Check sign-in details</button>
                <p class="form-status" id="sign-in-status" role="status" aria-live="polite"></p>
                <p class="form-footer">New to Tour Planner? <a href="registration.html">Register</a>.</p>
                <p class="form-footer"><a href="index.html">Back to home</a></p>
            </form>
        </main>
        <script>
            document.getElementById("sign-in-form").addEventListener("submit", (event) => {
                event.preventDefault();
                document.getElementById("sign-in-status").textContent =
                    "Sign-in is unavailable until an authentication service is connected. You have not been signed in.";
            });
        </script>
    </body>
</html>
